name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check_public.py
      - run: python scripts/install.py --root /tmp/github-archive-stage
      - run: python -m pip install build ruff==0.14.0
      - run: ruff check . && ruff format --check .
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl && github-archive --help && github-archive-audit --help
