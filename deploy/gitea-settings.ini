# Merge these sections into the existing Gitea app.ini. Never replace the whole file.
[database]
SQLITE_JOURNAL_MODE = WAL

[service]
DISABLE_REGISTRATION = true
SHOW_REGISTRATION_BUTTON = false

[openid]
ENABLE_OPENID_SIGNUP = false

[oauth2_client]
ENABLE_AUTO_REGISTRATION = false

# Optional on small hosts; install the wrapper first.
# [git]
# PATH = /usr/local/lib/github-archive/gitea-git.py
