# Include INSIDE the HTTPS server for Gitea. Replace its existing location /.
# Keep the archive backend bound to loopback; identity headers are trusted only here.
location = /_github_archive_auth {
    internal;
    proxy_pass http://127.0.0.1:3091/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Archive-User "";
}
location = /_github_archive_privacy {
    internal;
    proxy_pass http://127.0.0.1:3091/privacy-guard;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Archive-User "";
}
location /archive/ {
    auth_request /_github_archive_auth;
    auth_request_set $archive_user $upstream_http_x_archive_user;
    proxy_set_header X-Archive-User $archive_user;
    proxy_pass http://127.0.0.1:3091/;
    proxy_read_timeout 60s;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /github-archive/webhook {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:3091/webhook;
    proxy_set_header X-Archive-User "";
    access_log off;
}
location = /github-archive/callback {
    proxy_pass http://127.0.0.1:3091/callback;
    proxy_set_header X-Archive-User "";
    access_log off;
    add_header Referrer-Policy no-referrer always;
}
location /github-archive/bootstrap/ {
    proxy_pass http://127.0.0.1:3091/bootstrap/;
    proxy_set_header X-Archive-User "";
    access_log off;
    add_header Referrer-Policy no-referrer always;
}
location / {
    # Fail closed while a signed public-to-private transition is outstanding.
    auth_request /_github_archive_privacy;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Archive-User "";
}
